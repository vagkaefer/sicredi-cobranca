name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 exige PHP 8.3+.
          - php: '8.2'
            laravel: '13.*'
          # Laravel 11 não suporta PHP 8.5.
          - php: '8.5'
            laravel: '11.*'
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --no-progress --no-interaction

      - name: Code style
        if: matrix.php == '8.3' && matrix.laravel == '12.*'
        run: composer cs-check

      - name: Static analysis
        if: matrix.php == '8.3' && matrix.laravel == '12.*'
        run: composer phpstan

      - name: Tests
        run: composer test
